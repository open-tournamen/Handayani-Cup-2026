    <meta property="og:title" content="KingDC - High-Density Admin System" />
    <meta property="og:description" content="Aplikasi komprehensif administrasi dan pendaftaran tim turnamen sepak bola: verifikasi pemain, roster keabsahan, drawing grup, kuitansi registrasi, dan cetak ID Card." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/kingdc_logo.png" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox/iframe environment
      (function() {
        const filterViteWs = function(args) {
          try {
            const str = args.map(function(a) {
              return typeof a === 'object' && a !== null ? (a.message || a.stack || '') : String(a);
            }).join(' ');
            return str.includes('WebSocket') || str.includes('[vite]') || str.includes('failed to connect');
          } catch (e) {
            return false;
          }
        };

        const origError = console.error;
        console.error = function() {
          if (filterViteWs(Array.from(arguments))) return;
          origError.apply(console, arguments);
        };

        const origWarn = console.warn;
        console.warn = function() {
          if (filterViteWs(Array.from(arguments))) return;
          origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && filterViteWs([event.reason])) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (event && (filterViteWs([event.message, event.error]))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
